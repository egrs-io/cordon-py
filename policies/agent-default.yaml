version: 1
default: allow

# Default policy pack for egress-security v0.1.
#
# Rules are evaluated in order. Deny wins: if any rule matches with action
# deny, the call is blocked regardless of any earlier allow match.

rules:
  - id: block-github-repo-delete
    when:
      vendor: github
      method: DELETE
      path: '^/repos/[^/]+/[^/]+$'
    action: deny
    reason: "Repository deletion is destructive and irreversible."

  - id: block-github-ref-rewrite
    when:
      vendor: github
      method: PATCH
      path: '^/repos/[^/]+/[^/]+/git/refs/'
    action: deny
    reason: "Rewriting git refs can destroy history (force-push)."

  - id: block-aws-terminate
    when:
      vendor: 'aws:ec2'
      operation: '^TerminateInstances$'
    action: deny
    reason: "Terminating EC2 instances is destructive."

  - id: block-aws-deletes
    when:
      vendor: '^aws:'
      operation: '^Delete'
    action: deny
    reason: "Destructive AWS delete operation."

  - id: block-aws-iam-writes
    when:
      vendor: 'aws:iam'
      operation: '^(Create|Update|Put|Attach|Detach|Delete)'
    action: deny
    reason: "IAM modifications can escalate privilege."

  - id: block-secret-exfiltration
    when:
      vendor: http
      body_matches: '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{20,})'
    action: deny
    reason: "Outbound request body contains a credential pattern."

  - id: block-unknown-egress
    when:
      vendor: http
      host_not_in:
        - api.github.com
        - slack.com
        - '*.amazonaws.com'
        - registry.npmjs.org
        - pypi.org
    action: deny
    reason: "Outbound HTTP to a host that is not on the allowlist."

  # ----- subprocess shell-out bypass prevention -----
  # The SDK shims above don't help if the agent shells out to a network CLI.
  # Deny shell-out to known network binaries; agents must use the SDK or MCP.

  - id: block-network-cli-shellout
    when:
      vendor: subprocess
      operation: '^(curl|wget|gh|aws|gcloud|az|kubectl|ssh|scp|sftp|rsync|nc|ncat|netcat|socat|nmap|ftp|telnet|http|httpie)$'
    action: deny
    reason: "Use the corresponding SDK or MCP server -- shelling out to a network CLI bypasses egress policy."

  - id: block-git-network-shellout
    when:
      vendor: subprocess
      operation: '^git$'
      body_matches: '\b(push|fetch|pull|clone|fetch-pack|send-pack|ls-remote|remote)\b'
    action: deny
    reason: "Use the GitHub SDK for network git operations; subprocess git bypasses policy."

  - id: block-docker-network-shellout
    when:
      vendor: subprocess
      operation: '^docker$'
      body_matches: '\b(pull|push|login|logout|search)\b'
    action: deny
    reason: "docker pull/push/login reach the registry; use the SDK or pre-pull images."
